<h1>安装 Codex 额度提醒</h1>
<p>跟随安装向导点击“继续”和“安装”，无需拖拽应用。</p>
<p>安装位置：当前用户的 <code>~/Applications/Codex 额度提醒.app</code>。仅为当前用户安装，无需管理员密码。</p>
<p>更新前会请你退出正在运行的 Codex 额度提醒，然后替换应用。原有本地数据、钥匙串、偏好和登录启动设置会保留。</p>
<p>安装不会自动启动应用。完成后，请双击磁盘映像中的“2. 安装后双击启动”。通知权限、手机提醒和登录启动可在应用内自行设置。</p>
<p>个人非商业使用免费；用于工作、团队或其他商业用途须事先获得书面授权。下一步可阅读完整许可。</p>
